services:

  agente-ia:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: agente_comercial_ia
    restart: unless-stopped
    ports:
      - "8010:8010"
    env_file:
      - /media/sdb1/agente-ia-comercial/.env
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8010/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
