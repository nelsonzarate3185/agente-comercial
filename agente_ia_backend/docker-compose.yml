services:
  agente-ia:
    build: .
    container_name: agente_comercial_ia
    restart: unless-stopped
    ports:
      - "8010:8010"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8010/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
