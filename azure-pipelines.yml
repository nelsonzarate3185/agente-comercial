trigger:
- main

stages:

- stage: Validate
  displayName: "Validate"

  jobs:
  - job: Validation

    pool:
      name: Docker-Test

    steps:

    - checkout: self

    - script: |
        sudo /usr/local/sbin/deploy-agente-ia.sh \
        validate \
        "$(Build.SourcesDirectory)/agente_ia_backend"

      displayName: "Validar Docker Build"

- stage: Deploy_Dev
  displayName: "Deploy DEV"

  dependsOn: Validate

  condition: succeeded()

  jobs:
  - deployment: DeployAgenteIA

    pool:
      name: Docker-Test

    environment: Dev

    strategy:
      runOnce:
        deploy:

          steps:

          - checkout: self

          - script: |
              echo "Build ID: $(Build.BuildId)"
              echo "Commit: $(Build.SourceVersion)"
              echo "Branch: $(Build.SourceBranchName)"

            displayName: "Release Info"

          - script: |
              sudo BUILD_BUILDID=$(Build.BuildId) \
              /usr/local/sbin/deploy-agente-ia.sh \
              deploy \
              "$(Build.SourcesDirectory)/agente_ia_backend"

            displayName: "Deploy Agente IA DEV"