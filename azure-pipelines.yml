trigger:
- main

stages:

- stage: Build
  displayName: "Build y Validaciones"

  jobs:
  - job: Checkout

    pool:
      name: Docker-Test

    steps:

    - checkout: self

    - script: |
        echo "=========================================="
        echo "CONTENIDO DESCARGADO DESDE AZURE REPOS"
        echo "=========================================="

        echo "Build Sources Directory:"
        echo "$(Build.SourcesDirectory)"

        echo ""
        echo "Contenido:"
        ls -la "$(Build.SourcesDirectory)/agente_ia_backend"

      displayName: "Validar Checkout"

- stage: Deploy_Dev
  displayName: "Deploy DEV"

  dependsOn: Build

  jobs:
  - deployment: DeployAgenteIA

    pool:
      name: Docker-Test

    environment: Dev

    strategy:
      runOnce:
        deploy:

          steps:

          - checkout: self

          - script: |
              sudo /usr/local/sbin/deploy-agente-ia.sh "$(Build.SourcesDirectory)/agente_ia_backend"
            displayName: "Deploy Agente IA DEV"
